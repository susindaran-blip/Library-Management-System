<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | LibroVerse</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="brand">📚 LibroVerse</div>
    <div class="nav-links">
        <a href="#" class="tab-nav active" data-tab="catalog">Catalog</a>
        <a href="#" class="tab-nav" data-tab="mybooks">My Books</a>
        <a href="#" class="tab-nav" data-tab="wishlist">Wishlist</a>
        <a href="#" class="tab-nav" data-tab="recommend">For You</a>
        <a href="#" id="notif-btn">🔔<span class="badge-count" id="notif-count" style="display:none;">0</span></a>
        <button id="logout-btn">Logout</button>
    </div>
</nav>

<div class="container">
    <!-- ============ CATALOG TAB ============ -->
    <div id="tab-catalog">
        <div class="section-title">
            <h2>Explore the Library</h2>
            <span class="sub" id="welcome-msg"></span>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 Search by title, author, or ISBN...">
            <select id="category-filter"><option value="">All Categories</option></select>
            <select id="sort-filter">
                <option value="title">Sort: Title A-Z</option>
                <option value="newest">Sort: Newest First</option>
                <option value="rating">Sort: Top Rated</option>
                <option value="available">Sort: Most Available</option>
            </select>
        </div>
        <div id="book-grid-container"><div class="loader"><div class="spinner"></div></div></div>
    </div>

    <!-- ============ MY BOOKS TAB ============ -->
    <div id="tab-mybooks" style="display:none;">
        <div class="section-title"><h2>My Borrowed Books</h2></div>
        <div class="glass" style="overflow-x:auto; padding: 10px;">
            <table>
                <thead><tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th>Fine</th><th>Action</th></tr></thead>
                <tbody id="mybooks-tbody"><tr><td colspan="6"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- ============ WISHLIST TAB ============ -->
    <div id="tab-wishlist" style="display:none;">
        <div class="section-title"><h2>My Wishlist ❤️</h2></div>
        <div id="wishlist-grid" class="book-grid"></div>
    </div>

    <!-- ============ RECOMMENDATIONS TAB ============ -->
    <div id="tab-recommend" style="display:none;">
        <div class="section-title">
            <h2>Recommended For You ✨</h2>
            <span class="sub" id="recommend-basis"></span>
        </div>
        <div id="recommend-grid" class="book-grid"></div>
    </div>
</div>

<!-- ============ BOOK DETAIL MODAL ============ -->
<div class="modal-overlay" id="book-modal" style="display:none;">
    <div class="glass modal-content" style="position:relative;">
        <button class="modal-close" id="close-modal">✕</button>
        <div id="modal-body"></div>
    </div>
</div>

<!-- ============ NOTIFICATIONS MODAL ============ -->
<div class="modal-overlay" id="notif-modal" style="display:none;">
    <div class="glass modal-content" style="position:relative; max-width:420px;">
        <button class="modal-close" id="close-notif-modal">✕</button>
        <h3 style="margin-bottom:16px;">Notifications</h3>
        <div id="notif-list"></div>
    </div>
</div>

<footer>LibroVerse Library Management System &copy; 2026 — Built with ❤️ for readers</footer>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
